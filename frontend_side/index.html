<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKKU IMBA 44기 GOLF DAY</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="banner">

      <!-- Title -->
      <div class="banner-title">SKKU IMBA 44기 GOLF DAY</div>

      <!-- Body -->
      <div class="banner-body">

        <!-- Left: Date, Venue, Groups -->
        <div class="banner-left">
          <p class="date-venue">2026. 04.24. 아리지CC</p>
          <p class="group"><span class="group-num">1조</span> 진봉균, 이찬일, 안제영, 배홍렬</p>
          <p class="group"><span class="group-num">2조</span> 하태욱, 김인선, 황연주, 김정훈</p>
          <p class="group"><span class="group-num">3조</span> 김대성, 홍보라, 김영옥, 최진만</p>
        </div>

        <!-- Center: SKKU Logo -->
        <div class="banner-center">
          <div class="logo-wrap">
            <svg viewBox="0 0 160 180" width="140" height="158" xmlns="http://www.w3.org/2000/svg">
              <!-- Circle background -->
              <circle cx="80" cy="82" r="78" fill="#1a2e4a" stroke="#1a2e4a" stroke-width="2"/>

              <!-- Ginkgo leaf: left lobe -->
              <path d="
                M 80 120
                Q 30 105 28 62
                Q 26 30 60 22
                Q 78 18 80 38
                Z
              " fill="#4caf78" />

              <!-- Ginkgo leaf: right lobe -->
              <path d="
                M 80 120
                Q 130 105 132 62
                Q 134 30 100 22
                Q 82 18 80 38
                Z
              " fill="#3d9e68" />

              <!-- Stem -->
              <line x1="80" y1="120" x2="80" y2="140" stroke="#4caf78" stroke-width="4" stroke-linecap="round"/>

              <!-- "1398" text -->
              <text x="80" y="162" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="2">1398</text>
            </svg>
          </div>
        </div>

        <!-- Right: Hashtags -->
        <div class="banner-right">
          <p class="hashtag">#IMBA44기</p>
          <p class="hashtag">#GolfDay</p>
          <p class="hashtag">#동기라운드</p>
          <p class="hashtag">#우리이제 졸업해요</p>
          <p class="hashtag">#44기 졸업여행!같이가자!</p>
        </div>

      </div><!-- /.banner-body -->

      <!-- Footer -->
      <div class="banner-footer">함께 배운 시간, 함께 걷는 그린</div>

    </div><!-- /.banner -->
  </div>
</body>
</html>
